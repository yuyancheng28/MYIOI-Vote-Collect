<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYIOI 投票系统</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --line: rgba(148, 163, 184, 0.2);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --primary: #60a5fa;
        --primary-2: #a78bfa;
        --success: #34d399;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: var(--text);
      }
      .wrap {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
      }
      .card {
        background: rgba(17,24,39,0.9);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.35);
        padding: 24px;
        margin-bottom: 24px;
      }
      h1, h2, h3, p { margin-top: 0; }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .title {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 800;
        margin: 0;
      }
      .sub {
        color: var(--muted);
        margin-top: 8px;
      }
      .badge {
        padding: 10px 16px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 24px;
      }
      @media (max-width: 900px) {
        .grid { grid-template-columns: 1fr; }
      }
      label {
        display: block;
        font-size: 0.98rem;
        color: var(--muted);
        margin-bottom: 12px;
      }
      input, textarea, select, button {
        width: 100%;
        display: block;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(15, 23, 42, 0.85);
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
      }
      input, textarea, select { margin-top: 8px; }
      textarea { min-height: 110px; resize: vertical; }
      button {
        cursor: pointer;
        border: none;
        font-weight: 700;
        transition: transform 0.18s ease, opacity 0.18s ease;
      }
      button:hover { transform: translateY(-1px); }
      .primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
      }
      .danger {
        background: linear-gradient(135deg, #ef4444, #f97316);
        color: white;
      }
      .secondary {
        background: #334155;
        color: white;
      }
      .inline {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .inline > * { flex: 1 1 200px; }
      .muted { color: var(--muted); }
      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .poll-item {
        background: rgba(31, 41, 55, 0.92);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .poll-title { font-weight: 700; }
      .small { font-size: 0.86rem; color: var(--muted); }
      .vote-box {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .option {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .option input { width: auto; margin: 0; }
      .result-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 10px;
      }
      .notice {
        background: rgba(52, 211, 153, 0.12);
        color: #d1fae5;
        border: 1px solid rgba(52, 211, 153, 0.4);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 10px;
      }
      .dangerbox {
        background: rgba(248, 113, 113, 0.08);
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: #fecaca;
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 8px;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar card">
        <div>
          <p class="badge">MYIOI 投票平台</p>
          <h1 class="title">团队在线投票</h1>
          <p class="sub">基于 GitHub Issues / Token 的集中投票记录（适合团队内部快速使用）</p>
        </div>
        <div class="small" id="statusBox">未连接</div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>1. 登录到 GitHub（管理员）</h2>
          <label>
            GitHub Token（仓库 issues 权限）
            <input id="tokenInput" type="password" placeholder="ghp_xxx 或 github_pat_xxx" />
          </label>
          <div class="inline">
            <button class="primary" id="saveTokenBtn">保存 Token</button>
            <button class="secondary" id="clearTokenBtn">清空 Token</button>
          </div>
          <div class="notice" id="tokenNotice">
            说明：填写 token 后，页面可读取/新增仓库 Issue 来作为投票记录；推荐仅给 repo:issues 相关权限，避免超范围权限。
          </div>
        </div>

        <div class="card">
          <h2>2. 仓库配置</h2>
          <label>
            GitHub 仓库（owner/repo）
            <input id="repoInput" value="yuyancheng28/MYIOI-Vote-Collect" />
          </label>
          <label>
            主题标题（例：洛谷团队内部投票）
            <input id="themeInput" value="洛谷团队内部投票" />
          </label>
          <div class="inline">
            <button class="primary" id="connectRepoBtn">连接仓库</button>
            <button class="secondary" id="refreshPollsBtn">刷新投票列表</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>3. 创建投票</h2>
        <div class="grid">
          <div>
            <label>
              标题
              <input id="pollTitleInput" placeholder="例如：本周技术分享主题投票" />
            </label>
            <label>
              描述
              <textarea id="pollDescInput" placeholder="例如：请选择你最想参加的主题"></textarea>
            </label>
          </div>
          <div>
            <label>
              选项（每行一个）
              <textarea id="pollOptionsInput" placeholder="Python 进阶&#10;算法竞赛&#10;前端工程化"></textarea>
            </label>
            <button class="primary" id="createPollBtn">创建投票</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>4. 当前投票</h2>
        <div id="pollList" class="list"></div>
      </div>

      <div class="card hidden" id="votePanel">
        <h2 id="selectedPollTitle">投票详情</h2>
        <p id="selectedPollDesc" class="muted"></p>
        <div id="voteOptions" class="vote-box"></div>
        <div class="inline" style="margin-top: 20px;">
          <button class="primary" id="submitVoteBtn">提交投票</button>
          <button class="secondary" id="showResultsBtn">查看结果</button>
        </div>
        <div id="resultsBox" class="hidden" style="margin-top: 18px;"></div>
      </div>
    </div>

    <script>
      const TOKEN_KEY = 'myioi_token';
      const REPO_KEY = 'myioi_repo';
      const THEME_KEY = 'myioi_theme';
      let currentRepo = localStorage.getItem(REPO_KEY) || 'yuyancheng28/MYIOI-Vote-Collect';
      let token = localStorage.getItem(TOKEN_KEY) || '';
      let pollList = [];
      let selectedPoll = null;
      let selectedOption = null;
      let currentUser = null;

      const tokenInput = document.getElementById('tokenInput');
      const repoInput = document.getElementById('repoInput');
      const themeInput = document.getElementById('themeInput');
      const pollTitleInput = document.getElementById('pollTitleInput');
      const pollDescInput = document.getElementById('pollDescInput');
      const pollOptionsInput = document.getElementById('pollOptionsInput');
      const pollListEl = document.getElementById('pollList');
      const votePanel = document.getElementById('votePanel');
      const selectedPollTitle = document.getElementById('selectedPollTitle');
      const selectedPollDesc = document.getElementById('selectedPollDesc');
      const voteOptionsEl = document.getElementById('voteOptions');
      const resultsBox = document.getElementById('resultsBox');
      const statusBox = document.getElementById('statusBox');

      tokenInput.value = token;
      repoInput.value = currentRepo;
      themeInput.value = localStorage.getItem(THEME_KEY) || '洛谷团队内部投票';

      function setStatus(msg) {
        statusBox.textContent = msg;
      }

      function saveToken() {
        token = tokenInput.value.trim();
        if (!token) {
          alert('请输入 GitHub Token');
          return;
        }
        localStorage.setItem(TOKEN_KEY, token);
        setStatus('Token 已保存');
      }

      function clearToken() {
        token = '';
        tokenInput.value = '';
        localStorage.removeItem(TOKEN_KEY);
        setStatus('Token 已清空');
      }

      function saveRepo() {
        currentRepo = repoInput.value.trim();
        if (!currentRepo) return alert('请输入 owner/repo');
        localStorage.setItem(REPO_KEY, currentRepo);
        localStorage.setItem(THEME_KEY, themeInput.value.trim());
        setStatus('仓库已连接');
      }

      function api(path, options = {}) {
        const headers = {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        };
        if (token) headers.Authorization = `Bearer ${token}`;
        return fetch(`https://api.github.com${path}`, { ...options, headers });
      }

      async function fetchCurrentUser() {
        try {
          const res = await api('/user');
          if (!res.ok) throw new Error('GitHub token 无效');
          const data = await res.json();
          currentUser = data.login;
          setStatus(`已连接：${data.login}`);
          return data;
        } catch (e) {
          setStatus('Token 或仓库访问失败');
          throw e;
        }
      }

      async function listIssues() {
        const [owner, repo] = currentRepo.split('/');
        if (!owner || !repo) return alert('仓库格式错误，必须是 owner/repo');
        const res = await api(`/repos/${owner}/${repo}/issues?state=all&per_page=100`);
        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || '无法读取 issues');
        }
        const issues = await res.json();
        return issues.filter(i => !i.pull_request);
      }

      function parsePoll(issue) {
        const body = issue.body || '';
        const lines = body.split(/\r?\n/);
        const title = issue.title;
        const description = lines.find(line => line.startsWith('描述:'))?.replace(/^描述:\s*/, '') || '';
        const options = [];
        for (const line of lines) {
          const m = line.match(/^\d+\.\s*(.+)$/);
          if (m) options.push(m[1]);
        }
        return { issueNumber: issue.number, title, description, options, issueUrl: issue.html_url };
      }

      async function refreshPolls() {
        try {
          const issues = await listIssues();
          pollList = issues
            .map(parsePoll)
            .filter(p => p.options.length > 0)
            .filter(p => p.title.includes(themeInput.value.trim()) || p.title.includes('投票'));

          renderPollList();
        } catch (e) {
          console.error(e);
          alert('读取投票列表失败：请确认 token 有 repo issues 权限，并且仓库正确。');
        }
      }

      function renderPollList() {
        if (!pollList.length) {
          pollListEl.innerHTML = '<div class="small">暂无投票，先创建一个。</div>';
          return;
        }
        pollListEl.innerHTML = pollList.map(p => `
          <div class="poll-item" data-id="${p.issueNumber}">
            <div>
              <div class="poll-title">${escapeHtml(p.title)}</div>
              <div class="small">${p.options.length} 个选项 · #${p.issueNumber}</div>
            </div>
            <button class="secondary" data-open="${p.issueNumber}">进入</button>
          </div>
        `).join('');

        document.querySelectorAll('[data-open]').forEach(btn => {
          btn.onclick = () => openPollByNumber(Number(btn.getAttribute('data-open')));
        });
      }

      async function createPoll() {
        const [owner, repo] = currentRepo.split('/');
        if (!token) return alert('请先保存 GitHub Token');

        const title = document.getElementById('pollTitleInput').value.trim();
        const description = document.getElementById('pollDescInput').value.trim();
        const optionsText = document.getElementById('pollOptionsInput').value.trim();
        if (!title || !optionsText) return alert('标题和选项不能为空');

        const options = optionsText.split(/\n+/).map(x => x.trim()).filter(Boolean);
        if (options.length < 2) return alert('至少填写两个选项');

        const body = [
          `标题: ${themeInput.value.trim()}`,
          `描述: ${description || '暂无说明'}`,
          '',
          '投票规则：',
          '1. 请在评论区输入 /vote 1 /vote 2 这种格式',
          '2. 每个 GitHub 用户只能投一次',
          '',
          '选项：',
          ...options.map((o, idx) => `${idx + 1}. ${o}`),
        ].join('\n');

        const res = await api(`/repos/${owner}/${repo}/issues`, {
          method: 'POST',
          body: JSON.stringify({ title, body, labels: ['vote'] })
        });
        if (!res.ok) {
          const txt = await res.text();
          return alert('创建失败：' + txt);
        }
        await refreshPolls();
        alert('投票创建成功');
      }

      async function openPollByNumber(num) {
        const issues = await listIssues();
        const issue = issues.find(i => i.number === num);
        if (!issue) return alert('投票不存在');
        selectedPoll = parsePoll(issue);
        selectedPollTitle.textContent = selectedPoll.title;
        selectedPollDesc.textContent = selectedPoll.description || '暂无描述';
        votePanel.classList.remove('hidden');

        voteOptionsEl.innerHTML = selectedPoll.options.map((opt, idx) => `
          <label class="option">
            <input type="radio" name="choice" value="${idx + 1}" />
            <span>${idx + 1}. ${escapeHtml(opt)}</span>
          </label>
        `).join('');

        document.querySelectorAll('input[name="choice"]').forEach(r => {
          r.onclick = () => { selectedOption = Number(r.value); };
        });

        resultsBox.classList.add('hidden');
        document.getElementById('showResultsBtn').onclick = () => showResults();
        document.getElementById('submitVoteBtn').onclick = () => submitVote();
      }

      async function showResults() {
        if (!selectedPoll) return;
        const [owner, repo] = currentRepo.split('/');
        const commentsRes = await api(`/repos/${owner}/${repo}/issues/${selectedPoll.issueNumber}/comments?per_page=100`);
        if (!commentsRes.ok) return alert('读取投票结果失败');
        const comments = await commentsRes.json();

        const counts = selectedPoll.options.map(() => 0);
        const voters = new Set();
        for (const c of comments) {
          const body = c.body || '';
          const match = body.match(/\/vote\s+(\d+)/i);
          if (!match) continue;
          const voter = c.user && c.user.login ? c.user.login : 'unknown';
          const num = Number(match[1]);
          if (isNaN(num) || num < 1 || num > counts.length) continue;
          if (voters.has(voter)) continue;
          voters.add(voter);
          counts[num - 1] += 1;
        }

        resultsBox.classList.remove('hidden');
        resultsBox.innerHTML = `
          <h3>投票结果（${voters.size} 人已投）</h3>
          ${selectedPoll.options.map((opt, idx) => `
            <div class="result-row">
              <span>${escapeHtml(opt)}</span>
              <strong>${counts[idx]} 票</strong>
            </div>
          `).join('')}
        `;
      }

      async function submitVote() {
        if (!selectedPoll || !selectedOption) return alert('请先选择一项');
        const [owner, repo] = currentRepo.split('/');
        const body = `/vote ${selectedOption}`;

        // check existing comments from current user
        const commentsRes = await api(`/repos/${owner}/${repo}/issues/${selectedPoll.issueNumber}/comments?per_page=100`);
        if (!commentsRes.ok) return alert('无法访问评论记录');
        const comments = await commentsRes.json();
        const currentLogin = currentUser || await fetchCurrentUser().catch(() => null);
        if (currentLogin) {
          const hasVoted = comments.some(c => c.user && c.user.login === currentLogin && /\/vote\s+\d+/i.test(c.body || ''));
          if (hasVoted) {
            alert('你已经投过票了，不能重复投票');
            return;
          }
        }

        const res = await api(`/repos/${owner}/${repo}/issues/${selectedPoll.issueNumber}/comments`, {
          method: 'POST',
          body: JSON.stringify({ body })
        });

        if (!res.ok) {
          const txt = await res.text();
          return alert('投票失败：' + txt);
        }
        alert('投票成功');
        await showResults();
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      document.getElementById('saveTokenBtn').onclick = saveToken;
      document.getElementById('clearTokenBtn').onclick = clearToken;
      document.getElementById('connectRepoBtn').onclick = () => {
        saveRepo();
        fetchCurrentUser().then(refreshPolls).catch(() => {});
      };
      document.getElementById('refreshPollsBtn').onclick = refreshPolls;
      document.getElementById('createPollBtn').onclick = createPoll;

      window.onload = async () => {
        if (token) {
          try {
            await fetchCurrentUser();
            await refreshPolls();
          } catch (e) {}
        }
      };
    </script>
  </body>
</html>
